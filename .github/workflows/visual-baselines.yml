name: Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-linux-baselines:
    name: Generate Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Generate Linux snapshots
        run: npm run test:visual:update
        env:
          CI: "true"

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux-baselines
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          retention-days: 14
