name: Feature request
description: Suggest a feature or an improvement to an existing one.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For large changes, describe the problem first so we can agree on the
        approach before implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Quran
        - Hadith
        - Azkar
        - Prayer times
        - Tasbeeh
        - Sadaqa Jariyah
        - Search
        - Accessibility
        - Performance
        - Other
    validations:
      required: true
  - type: dropdown
    id: locales
    attributes:
      label: Applies to
      options:
        - Both languages
        - Arabic only
        - English only
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This request respects the project's purpose and content sources.
          required: true
