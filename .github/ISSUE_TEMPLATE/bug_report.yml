name: Bug report
description: Report something that is broken or not behaving as documented.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include keys, tokens, or personal data.
        For security issues, use private reporting instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Opening a surah from the Quran index shows the wrong page.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /en/read-quran
        2. Click Al-Fatiha
        3. See ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Affected route or page
      placeholder: /ar/tasbeeh
  - type: dropdown
    id: locale
    attributes:
      label: Language
      options:
        - Arabic (ar)
        - English (en)
        - Both
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
  - type: input
    id: browsers
    attributes:
      label: Browser and OS
      placeholder: Chrome 130, Windows 11
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console output
      description: Drag images here. Remove anything personal first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no secrets or personal data.
          required: true
